services:
  backoffice:
    build: .
    container_name: backoffice
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Everything lives here: inventory.db, photos/, session.key.
      # Back this one directory up and you have backed up the whole system.
      - ./data:/data
    environment:
      # Set a password to require a login. Leave it out for an open LAN app.
      # AUTH_PASSWORD: "change-me"
      SITE_TITLE: "Backoffice"
      TZ: "UTC"
      # Importing from a link fetches the page server-side. Private/LAN
      # addresses are refused by default so a pasted URL cannot be used to
      # reach your router or NAS. Set this to 1 only if you want to import
      # from something on your own network.
      # ALLOW_PRIVATE_FETCH: "1"
