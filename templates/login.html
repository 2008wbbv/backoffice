{{define "login.html"}}
{{template "top" .}}

<form class="form narrow" method="post" action="/login">
  <h1>Sign in</h1>
  <input type="hidden" name="next" value="{{.Data.Next}}">
  <label class="field wide">
    <span>Password</span>
    <input name="password" type="password" autofocus required autocomplete="current-password">
  </label>
  <div class="actions"><button class="btn primary" type="submit">Sign in</button></div>
</form>

{{template "bottom" .}}
{{end}}
